services:
  # PostgreSQL Database for GitLab
  postgresql:
    image: postgres:16-alpine
    container_name: gitlab-postgresql
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitlab}
      POSTGRES_USER: ${POSTGRES_USER:-gitlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitlab_password_secure}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /data/gitlab/postgresql:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitlab}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gitlab-network

  # Redis for GitLab caching
  redis:
    image: redis:7-alpine
    container_name: gitlab-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /data/gitlab/redis:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gitlab-network

  gitlab-server:
    image: 'gitlab/gitlab-ce:latest'
    container_name: gitlab-server
    restart: always
    hostname: 'gitlab.hungngquang.xyz'
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitlab-https.rule=Host('gitlab.hungngquang.xyz')
      - traefik.http.routers.gitlab-https.entrypoints=websecure
      - traefik.http.routers.gitlab-https.tls=true
      - traefik.http.routers.gitlab-https.tls.certresolver=cloudflare
      - traefik.http.services.gitlab-service.loadbalancer.server.port=80
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.hungngquang.xyz'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['time_zone'] = 'UTC'
        
        # Enable HTTPS redirect
        nginx['redirect_http_to_https'] = true
        
        # Database configuration
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_host'] = 'postgresql'
        gitlab_rails['db_port'] = '5432'
        gitlab_rails['db_database'] = '${POSTGRES_DB:-gitlab}'
        gitlab_rails['db_username'] = '${POSTGRES_USER:-gitlab}'
        gitlab_rails['db_password'] = '${POSTGRES_PASSWORD:-gitlab_password_secure}'
        
        # Redis configuration
        gitlab_rails['redis_host'] = 'redis'
        gitlab_rails['redis_port'] = '6379'
        
        # Performance settings - Optimized for faster startup
        puma['worker_processes'] = 1
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        puma['worker_timeout'] = 60
        
        # Disable unnecessary services for faster startup
        gitlab_rails['gitlab_kas_enabled'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['sentry_enabled'] = false
        gitlab_rails['gitlab_email_enabled'] = false
        
        # Optimize GitLab startup
        gitlab_rails['auto_migrate'] = true
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        
        # Memory optimizations
        postgresql['shared_buffers'] = "128MB"
        postgresql['effective_cache_size'] = "512MB"
        postgresql['work_mem'] = "4MB"
        postgresql['maintenance_work_mem'] = "64MB"
        redis['maxmemory'] = "128MB"
        redis['maxmemory_policy'] = "allkeys-lru"
    volumes:
      - /data/gitlab/config:/etc/gitlab
      - /data/gitlab/logs:/var/log/gitlab
      - /data/gitlab/data:/var/opt/gitlab
      - /data/gitlab/artifacts:/var/opt/gitlab/gitlab-rails/shared/artifacts
      - /data/gitlab/ssl:/etc/gitlab/ssl
    ports:
      - "80:80"
      - "443:443"
      - "2222:22"
    shm_size: '512m'
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 300s
    networks:
      - gitlab-network
  # Cloudflare Tunnel: Securely expose GitLab to the internet
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gitlab-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "service:gitlab-server"
    restart: always
    depends_on:
      gitlab-server:
        condition: service_healthy

networks:
  gitlab-network:
    driver: bridge